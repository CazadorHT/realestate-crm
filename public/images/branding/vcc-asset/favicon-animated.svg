<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="vccGradFavAnim" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#4F46E5"/></linearGradient></defs><style>@keyframes assembleV{0%{transform:translate(-20px,10px);opacity:0}100%{transform:translate(0,0);opacity:1}}@keyframes assembleC{0%{transform:translate(20px,10px);opacity:0}100%{transform:translate(0,0);opacity:1}}@keyframes assembleTop{0%{transform:translateY(-20px);opacity:0}100%{transform:translateY(0);opacity:0.8}}@keyframes isometricFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.iso-mark{animation:isometricFloat 4s ease-in-out infinite 2s}.side-v{animation:assembleV 1s ease-out forwards;fill:#0F172A}.side-c{animation:assembleC 1s ease-out forwards .2s;fill:url(#vccGradFavAnim);opacity:0}.side-top{animation:assembleTop 1s ease-out forwards .4s;fill:#3B82F6;opacity:0}</style><g transform="translate(10,0)"><g class="iso-mark"><path class="side-v" d="M0 30l40-20v60l-40 20z"/><path class="side-c" d="M40 10l40 20v60l-40-20z"/><path class="side-top" d="M0 30l40-20 40 20-40 20z"/></g></g></svg>
