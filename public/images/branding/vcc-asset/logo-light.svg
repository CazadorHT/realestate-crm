<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120"><defs><linearGradient id="vccGradLight" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#818CF8"/></linearGradient></defs><style>@keyframes assembleV{0%{transform:translate(-20px,10px);opacity:0}100%{transform:translate(0,0);opacity:1}}@keyframes assembleC{0%{transform:translate(20px,10px);opacity:0}100%{transform:translate(0,0);opacity:1}}@keyframes assembleTop{0%{transform:translateY(-20px);opacity:0}100%{transform:translateY(0);opacity:0.3}}@keyframes assembleText{0%{transform:translateY(-10px);opacity:0}100%{transform:translateY(0);opacity:1}}@keyframes continuousFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.iso-mark{animation:continuousFloat 4s ease-in-out infinite 2s}.side-v{animation:assembleV 1s ease-out forwards;fill:#FFF}.side-c{animation:assembleC 1s ease-out forwards .2s;fill:url(#vccGradLight);opacity:0}.side-top{animation:assembleTop 1s ease-out forwards .4s;fill:#FFF;opacity:0}.brand-text{font-family:system-ui,-apple-system,sans-serif;font-size:48px;font-weight:800;fill:#FFF;animation:assembleText 1.2s ease-out forwards}.brand-accent{fill:#60A5FA;font-weight:400}.sub-text{font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;fill:#94A3B8;letter-spacing:5px;animation:assembleText 1.5s ease-out forwards}</style><g transform="translate(30,5)"><g class="iso-mark"><path class="side-v" d="M0 30l40-20v60l-40 20z"/><path class="side-c" d="M40 10l40 20v60l-40-20z"/><path class="side-top" d="M0 30l40-20 40 20-40 20z"/></g></g><text x="135" y="60" class="brand-text">VCC<tspan class="brand-accent"> ASSET</tspan></text><text x="138" y="87" class="sub-text">PREMIUM REAL ESTATE</text></svg>
